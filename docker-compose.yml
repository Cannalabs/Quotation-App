version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: grow
      POSTGRES_USER: growuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Use environment variables for database connection
      # If DATABASE_URL is not set, construct it from POSTGRES_PASSWORD
      # Format: postgresql+asyncpg://USER:PASSWORD@HOST:PORT/DBNAME
      # URL encode special characters in password (e.g., @ becomes %40)
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://growuser:${POSTGRES_PASSWORD:-your_secure_password}@postgres:5432/grow}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://yourdomain.com}
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "8001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
